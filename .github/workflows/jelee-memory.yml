name: Jelee memory evidence (strict)

# The runtime memory contracts and the five-minute RSS / heap budgets of the
# PostgreSQL integration job in jelee.yml run there on every push and pull
# request without blocking it (continue-on-error). This workflow runs the
# same two steps every day and on demand, and fails when either fails. See
# docs/quality-gates.md ("記憶體證據").

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-memory-strict:
    name: Runtime memory evidence and budgets (strict)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: jelee
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: jelee_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U jelee -d jelee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JELEE_TEST_DATABASE_URL: postgres://jelee:ci-only@localhost:5432/jelee_test?sslmode=disable
      JELEE_REQUIRE_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tools
          key: jelee-${{ runner.os }}-${{ runner.arch }}-go1.27.1-${{ hashFiles('tools/manifest.json', 'go.sum') }}
      - name: Tools, media runtimes and fixtures
        # The memory workloads build the production image, which copies the
        # pinned mkvtoolnix and MediaInfo files: install and verify them first.
        run: make bootstrap tools-verify bootstrap-media media-tools-verify bootstrap-runtime runtime-tools-verify bootstrap-matroska matroska-tools-verify fixtures
      - name: Runtime memory evidence and configuration contracts
        id: runtime-memory-contracts
        # Invoke directly so the original child exit code is not replaced by
        # GNU make's generic failure status. The wrapper always starts a report.
        run: python3 -B scripts/runtime_memory_contracts.py
      - name: Fixed RSS budgets and heap comparisons under five-minute mixed media load
        id: family-ignore-sustained-worker
        # Runs after a contracts failure too, so one run keeps both verdicts.
        if: always() && steps.runtime-memory-contracts.outcome != 'skipped'
        run: |
          set -o pipefail
          mkdir -p .testdata
          make runtime-memory-worker-test 2>&1 | tee .testdata/runtime-memory-step.txt
      - name: Annotate runtime memory acceptance failure
        # Job logs and artifacts need a browser session; annotations are readable
        # through the checks API, so the tail of the failure is copied there.
        if: failure() && (steps.runtime-memory-contracts.outcome == 'failure' || steps.family-ignore-sustained-worker.outcome == 'failure')
        run: |
          for file in .testdata/runtime-memory-contracts.json .testdata/runtime-memory-step.txt .testdata/runtime-memory-acceptance.txt; do
            [ -s "$file" ] || continue
            # Lines are long JSON; the last few hold the verdict and must fit.
            body=$(tail -n 4 "$file" | cut -c1-900 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$(basename "$file")::$body"
          done
      - name: Retain memory and mixed sustained acceptance evidence
        if: always() && (steps.runtime-memory-contracts.outcome != 'skipped' || steps.family-ignore-sustained-worker.outcome != 'skipped')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-memory-acceptance-strict
          path: |
            .testdata/runtime-memory-contracts.json
            .testdata/runtime-memory-acceptance.txt
            .testdata/runtime-memory-summary.json
            .testdata/runtime-memory-case-*.json
            .testdata/runtime-memory-heap-gogc*/heap-analysis-state.json
            tools/resident-memory-budget.json
            docs/evidence/resident-memory-baseline.json
          if-no-files-found: error
          retention-days: 14
          # .testdata is hidden; uploads whose paths share a wider root would drop it.
          include-hidden-files: true
