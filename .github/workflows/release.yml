name: Jelee release (draft)

# G01.3: release artifacts come from an explicit SemVer tag. Pushing a tag
# vMAJOR.MINOR.PATCH[-pre] runs this workflow, which only creates a *draft*
# GitHub release; a maintainer reviews and publishes it by hand. Nothing here
# pushes tags, edits history or publishes on its own. Local rehearsal:
# `make release-dry-run` (docs/git-workflow.md#发布标签流程).

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Needed only to create the draft release and upload its assets.
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Fails before any build when the tag is not SemVer, CHANGELOG.md has no
      # section for the version, or web/package.json / buildinfo.DefaultVersion
      # disagree with it. Upstream Jellyfin tags (v10.x) stop here too.
      - name: Validate tag, CHANGELOG and versions
        run: python3 -B scripts/release.py check --tag "$GITHUB_REF_NAME"
      - name: Tag must be on a branch of this repository
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -q . || { echo "tagged commit is not on any branch" >&2; exit 1; }
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tools
          key: jelee-${{ runner.os }}-${{ runner.arch }}-go1.27.1-${{ hashFiles('tools/manifest.json', 'go.sum') }}
      - run: make bootstrap tools-verify
      # The tagged commit already passed the full CI on its branch; these are
      # the fast repository gates plus the unit tests, as a last check.
      - name: Repository gates and tests
        run: make text-check secret-scan gitignore-check test
      - name: Build the web client
        run: make web-install web-build
      - name: Build archives, checksums and notes
        run: python3 -B scripts/release.py build --tag "$GITHUB_REF_NAME" --go .bin/go --out dist/release --web-dist web/dist
      - name: Verify checksums
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS
      - name: Keep the artifacts with the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jelee-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $prerelease \
            --title "Jelee ${GITHUB_REF_NAME#v}" --notes-file dist/release/release-notes.md \
            dist/release/*.tar.gz dist/release/*.zip dist/release/SHA256SUMS
