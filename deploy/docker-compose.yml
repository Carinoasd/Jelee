services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: jelee
      POSTGRES_PASSWORD: ${JELEE_POSTGRES_PASSWORD:?Provide a strong URL-safe database password}
      POSTGRES_DB: jelee
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U jelee -d jelee]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ..
    image: jelee/jelee:0.1.0-dev
    entrypoint: [/jelee-migrate]
    command: [up]
    environment:
      JELEE_DATABASE_URL: postgres://jelee:${JELEE_POSTGRES_PASSWORD}@postgres:5432/jelee?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
  jelee:
    image: jelee/jelee:0.1.0-dev
    environment:
      JELEE_DATABASE_URL: postgres://jelee:${JELEE_POSTGRES_PASSWORD}@postgres:5432/jelee?sslmode=disable
      JELEE_ALLOWED_HOSTS: ${JELEE_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      JELEE_ENABLE_CATALOG: 'true'
      JELEE_ENABLE_DIRECT: ${JELEE_ENABLE_DIRECT:-false}
      JELEE_ENABLE_ACCOUNTS: ${JELEE_ENABLE_ACCOUNTS:-false}
      JELEE_ENABLE_JOBS: ${JELEE_ENABLE_JOBS:-false}
      JELEE_ENABLE_PROBE: ${JELEE_ENABLE_PROBE:-false}
      JELEE_ENABLE_FAMILY_IGNORE: ${JELEE_ENABLE_FAMILY_IGNORE:-false}
    ports:
      - 127.0.0.1:8097:8097
    volumes:
      - ${JELEE_MEDIA_ROOT:?Provide an existing media directory}:/media:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    stop_grace_period: 20s
