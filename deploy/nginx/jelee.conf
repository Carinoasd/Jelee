# Jelee reference reverse proxy for nginx >= 1.25.1 (G37.3, G11).
#
# Reference only: syntax was checked with `nginx -t`, but this file has NOT
# been verified against a real public deployment, real clients or real media.
# Verify Range seeking, large-file playback, Host checks and logs in your own
# environment before relying on it (see docs/deployment.md).
#
# Install inside the `http {}` context, e.g. /etc/nginx/conf.d/jelee.conf.
# Replace media.example.com and the certificate paths. Jelee must list the
# public host name in JELEE_ALLOWED_HOSTS, and JELEE_TRUSTED_PROXIES must
# contain the address this proxy connects FROM as Jelee sees it:
#   - nginx on the same host, Jelee listening on 127.0.0.1:8097:
#       JELEE_TRUSTED_PROXIES='127.0.0.1/32,::1/128'
#   - Jelee in the bundled Compose stack: the peer is usually the Docker
#     bridge gateway, not 127.0.0.1; use the narrowest CIDR that matches it.
# Never trust a range that untrusted clients can connect from.

# Hide the nginx version in headers and error pages.
server_tokens off;

upstream jelee {
    # Keep Jelee on loopback/private network only (default 127.0.0.1:8097).
    server 127.0.0.1:8097;
    keepalive 32;
}

# Reject requests whose Host is not the published name, including requests
# addressed to the bare IP. 444 closes the connection without a response, so
# nothing (not even an nginx error page) is disclosed.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    # nginx needs some certificate for the TLS listener; ssl_reject_handshake
    # refuses the handshake for unknown SNI instead of presenting it.
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name media.example.com;
    # Relative-free redirect built from the configured name, never from the
    # client supplied Host header.
    return 308 https://media.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.example.com;

    ssl_certificate     /etc/nginx/tls/media.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/media.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:jelee_tls:10m;
    ssl_session_tickets off;

    # Jelee only adds HSTS on direct TLS; TLS terminates here, so add it at
    # the proxy. Start with a short max-age until the deployment is verified.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Largest Jelee JSON body is 2 MiB; Jelee enforces exact per-route limits
    # and answers body_too_large itself. Keep this slightly above so the
    # client normally gets Jelee's JSON error rather than an nginx page.
    client_max_body_size 4m;
    # Small bodies only: keep request buffering on to shield Jelee from slow
    # uploads (Jelee's own ReadTimeout is 15 s).
    proxy_request_buffering on;

    # Media must not be recompressed; Jelee decides compression itself.
    gzip off;

    # Privacy: logs hold client addresses. Keep them short-lived, restrict
    # access, and avoid logging query strings that may carry identifiers.
    access_log /var/log/nginx/jelee.access.log combined;
    error_log  /var/log/nginx/jelee.error.log warn;

    # Never let error pages, redirects or headers point at the upstream.
    proxy_redirect off;
    proxy_intercept_errors off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    location / {
        proxy_pass http://jelee;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Jelee validates Host against JELEE_ALLOWED_HOSTS; pass the matched
        # server name, not an arbitrary client value.
        proxy_set_header Host $server_name;

        # Edge proxy: replace any client supplied chain with the real peer.
        # If another trusted proxy/CDN sits in front, use
        # $proxy_add_x_forwarded_for together with set_real_ip_from instead.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Jelee ignores these for addresses, privileges and URLs; drop the
        # client supplied values so they never reach the backend or its logs.
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";

        # Range/conditional requests go to Jelee untouched (nginx forwards
        # them by default; stated explicitly so nobody "optimises" them away).
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Direct delivery of large files: stream, do not buffer or spool to
        # disk, and do not cache.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;

        # Timeouts. Jelee aborts a stream when a single write stalls for 30 s
        # (paused players are expected to reconnect with Range), so these only
        # need to exceed that.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        send_timeout 120s;
    }

    # Prometheus metrics require a Jelee admin token already; additionally
    # keep the endpoint off the public edge. Adjust to your scraper address.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://jelee;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
